name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build local workspace packages
        run: |
          yarn workspace lyf-registration-schemas build
          yarn workspace small-group-pairing build

      # Secrets are not inherited by forks; an empty API key builds fine but the
      # deployed app crashes on load with auth/invalid-api-key. Fail here instead.
      - name: Check Firebase config is present
        run: |
          for v in GATSBY_FIREBASE_API_KEY GATSBY_FIREBASE_AUTH_DOMAIN GATSBY_FIREBASE_PROJECT_ID GATSBY_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty — add it under Settings → Secrets and variables → Actions for this repository"
              missing=1
            fi
          done
          [ -z "${missing:-}" ]
        env:
          GATSBY_FIREBASE_API_KEY: ${{ secrets.GATSBY_FIREBASE_API_KEY }}
          GATSBY_FIREBASE_AUTH_DOMAIN: ${{ secrets.GATSBY_FIREBASE_AUTH_DOMAIN }}
          GATSBY_FIREBASE_PROJECT_ID: ${{ secrets.GATSBY_FIREBASE_PROJECT_ID }}
          GATSBY_FIREBASE_APP_ID: ${{ secrets.GATSBY_FIREBASE_APP_ID }}

      - name: Build website
        # GATSBY_CUSTOM_DOMAIN unset  -> github.io/<repo> hosting, assets prefixed
        # GATSBY_CUSTOM_DOMAIN set    -> custom-domain hosting at the root + CNAME
        run: |
          if [ -n "$GATSBY_CUSTOM_DOMAIN" ]; then
            yarn workspace lyf-registration-website run build
            echo "$GATSBY_CUSTOM_DOMAIN" > website/public/CNAME
          else
            yarn workspace lyf-registration-website run build --prefix-paths
          fi
        env:
          GATSBY_CUSTOM_DOMAIN: ${{ vars.GATSBY_CUSTOM_DOMAIN }}
          GATSBY_FIRESTORE_DATABASE_ID: ${{ vars.GATSBY_FIRESTORE_DATABASE_ID || 'lyf-v2' }}
          GATSBY_FIRESTORE_TEST_DATABASE_ID: ${{ vars.GATSBY_FIRESTORE_TEST_DATABASE_ID || 'lyf-v2-test' }}
          GATSBY_FIREBASE_API_KEY: ${{ secrets.GATSBY_FIREBASE_API_KEY }}
          GATSBY_FIREBASE_AUTH_DOMAIN: ${{ secrets.GATSBY_FIREBASE_AUTH_DOMAIN }}
          GATSBY_FIREBASE_PROJECT_ID: ${{ secrets.GATSBY_FIREBASE_PROJECT_ID }}
          GATSBY_FIREBASE_STORAGE_BUCKET: ${{ secrets.GATSBY_FIREBASE_STORAGE_BUCKET }}
          GATSBY_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GATSBY_FIREBASE_MESSAGING_SENDER_ID }}
          GATSBY_FIREBASE_APP_ID: ${{ secrets.GATSBY_FIREBASE_APP_ID }}
          GATSBY_FIREBASE_MEASUREMENT_ID: ${{ secrets.GATSBY_FIREBASE_MEASUREMENT_ID }}
          GATSBY_STRIPE_PUBLIC_KEY: ${{ secrets.GATSBY_STRIPE_PUBLIC_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
