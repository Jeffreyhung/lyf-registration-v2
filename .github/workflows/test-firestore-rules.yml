name: Test Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firestore-rules-tests/**"
      - ".github/workflows/test-firestore-rules.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firestore-rules-tests/**"
      - ".github/workflows/test-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn

      # The Firestore emulator needs a JRE
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run rules tests against the emulator
        run: >
          npx firebase-tools emulators:exec --only firestore --project demo-lyf-rules
          "yarn workspace firestore-rules-tests test"
