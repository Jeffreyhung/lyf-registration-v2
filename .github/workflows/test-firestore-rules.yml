name: Test Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firestore-rules-tests/**"
      - ".github/workflows/test-firestore-rules.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firestore-rules-tests/**"
      - ".github/workflows/test-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      # The Firestore emulator needs a JRE
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run rules tests against the emulator
        run: >
          npx firebase-tools emulators:exec --only firestore --project demo-lyf-rules
          "yarn workspace firestore-rules-tests test"
