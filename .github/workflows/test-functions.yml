name: Test Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "schemas/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/test-functions.yml"
  pull_request:
    paths:
      - "functions/**"
      - "schemas/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/test-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn workspace functions lint

      # Builds the schemas workspace first; the tests import lyf-registration-schemas.
      - name: Run unit tests
        run: yarn workspace functions test

      - name: Type-check the production build
        run: yarn --cwd functions tsc --noEmit -p tsconfig.json
